<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講師管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --danger: #d93025;
    --success: #188038;
    --warning: #f29900;
    --gray-50: #f8f9fa;
    --gray-100: #f1f3f4;
    --gray-200: #e8eaed;
    --gray-400: #bdc1c6;
    --gray-600: #80868b;
    --gray-800: #3c4043;
    --gray-900: #202124;
    --border: #dadce0;
    --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
    --radius: 8px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
    font-size: 14px;
  }

  /* === 頂部導覽 === */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 8px;
  }
  .topbar-logo {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    margin-right: 24px;
    white-space: nowrap;
  }
  .nav-btn {
    padding: 8px 16px;
    border: none;
    background: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-800);
    transition: background 0.15s;
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--gray-100); }
  .nav-btn.active { background: #e8f0fe; color: var(--primary); font-weight: 500; }

  /* === 主容器 === */
  .main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  /* === 頁面 === */
  .page { display: none; }
  .page.active { display: block; }

  /* === 卡片 === */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-900);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
  }

  /* === 表單 === */
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .form-group.full { flex: 100%; min-width: 100%; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--gray-600); }
  .form-group input,
  .form-group select,
  .form-group textarea {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-900);
    background: #fff;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  .form-group textarea { resize: vertical; min-height: 72px; }

  /* 銀行搜尋 */
  .bank-search-wrap { position: relative; }
  .bank-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    max-height: 200px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .bank-dropdown.show { display: block; }
  .bank-option {
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 13px;
  }
  .bank-option:hover { background: var(--gray-100); }
  .bank-option span { color: var(--gray-600); margin-right: 8px; font-size: 12px; }

  /* 課程時間欄位 */
  .course-type-fields { display: none; }
  .course-type-fields.show { display: flex; }

  /* === 按鈕 === */
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: #e8f0fe; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: #fce8e6; }
  .btn-success { background: #fff; color: var(--success); border: 1px solid var(--success); }
  .btn-success:hover { background: #e6f4ea; }

  /* === 篩選列 === */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar .filter-label { font-size: 13px; color: var(--gray-600); }
  .filter-chip {
    padding: 5px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--gray-800);
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
  .filter-chip.active { background: #e8f0fe; border-color: var(--primary); color: var(--primary); font-weight: 500; }

  /* === 資料表格 === */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-600);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gray-100);
    font-size: 13px;
    color: var(--gray-800);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }

  /* === 狀態標籤 === */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-active { background: #e6f4ea; color: var(--success); }
  .badge-inactive { background: #f1f3f4; color: var(--gray-600); }
  .badge-regular { background: #e8f0fe; color: var(--primary); }
  .badge-camp { background: #fce8e6; color: var(--danger); }
  .badge-planned { background: #fef7e0; color: var(--warning); }
  .badge-completed { background: #f1f3f4; color: var(--gray-600); }

  /* === 操作按鈕區 === */
  .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }

  /* === 彈窗 === */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    width: 90%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: var(--shadow-lg);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--gray-900);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--gray-600);
    line-height: 1;
    padding: 4px;
  }
  .modal-close:hover { color: var(--gray-900); }
  .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }

  /* 詳細資訊區塊 */
  .detail-section { margin-bottom: 16px; }
  .detail-section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--gray-100);
  }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .detail-label { font-size: 12px; color: var(--gray-600); width: 80px; flex-shrink: 0; padding-top: 1px; }
  .detail-value { font-size: 13px; color: var(--gray-900); flex: 1; }

  /* 行內編輯 select */
  .inline-select {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    background: #fff;
  }
  .inline-select:focus { outline: none; border-color: var(--primary); }

  /* === 空狀態 === */
  .empty-state { text-align: center; padding: 40px 16px; color: var(--gray-600); }
  .empty-state-icon { font-size: 36px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* === 載入中 === */
  .loading { text-align: center; padding: 32px; color: var(--gray-600); font-size: 13px; }

  /* === Toast 通知 === */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gray-900);
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 分隔線 */
  .section-sep { border: none; border-top: 1px solid var(--gray-100); margin: 16px 0; }

  /* 課程 Session 區 */
  .session-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 13px;
  }
  .session-item:last-child { border-bottom: none; }

  @media (max-width: 600px) {
    .topbar { padding: 0 12px; }
    .main { padding: 16px 10px; }
    .form-group { min-width: 100%; }
    .modal { max-width: 98vw; padding: 16px; }
  }
</style>
</head>
<body>

<!-- 頂部導覽 -->
<div class="topbar">
  <div class="topbar-logo">📋 講師管理系統</div>
  <button class="nav-btn active" onclick="switchPage('teachers')">講師管理</button>
  <button class="nav-btn" onclick="switchPage('courses')">課程管理</button>
  <button class="nav-btn" onclick="switchPage('availability')">可上班時間</button>
</div>

<div class="main">

  <!-- ========== 講師頁面 ========== -->
  <div class="page active" id="page-teachers">

    <!-- 新增講師表單 -->
    <div class="card">
      <div class="card-title">新增講師</div>
      <div class="form-row">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="t-name" placeholder="王小明">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="t-email" placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label>手機號碼</label>
          <input type="tel" id="t-phone" placeholder="0912345678">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>身分證字號</label>
          <input type="text" id="t-id-number" placeholder="A123456789">
        </div>
        <div class="form-group">
          <label>生日</label>
          <input type="date" id="t-birthday">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>地址</label>
          <input type="text" id="t-address" placeholder="台北市中正區...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>銀行代碼</label>
          <div class="bank-search-wrap">
            <input type="text" id="t-bank-search" placeholder="輸入銀行名稱或代碼搜尋" autocomplete="off" oninput="filterBanks()" onfocus="showBankDropdown()" onblur="hideBankDropdown()">
            <input type="hidden" id="t-bank-code">
            <div class="bank-dropdown" id="bank-dropdown"></div>
          </div>
        </div>
        <div class="form-group">
          <label>銀行帳號</label>
          <input type="text" id="t-bank-account" placeholder="帳號數字">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>備註</label>
          <textarea id="t-note" placeholder="其他備註..."></textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" onclick="createTeacher()">新增講師</button>
      </div>
    </div>

    <!-- 講師清單 -->
    <div class="card">
      <div class="card-title">講師清單</div>
      <div class="filter-bar">
        <span class="filter-label">篩選：</span>
        <button class="filter-chip active" onclick="filterTeachers('all', this)">全部</button>
        <button class="filter-chip" onclick="filterTeachers('active', this)">在職</button>
        <button class="filter-chip" onclick="filterTeachers('inactive', this)">離職</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>Email</th>
              <th>手機</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="teacher-list">
            <tr><td colspan="5" class="loading">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ========== 課程頁面 ========== -->
  <div class="page" id="page-courses">

    <!-- 新增課程表單 -->
    <div class="card">
      <div class="card-title">新增課程</div>
      <div class="form-row">
        <div class="form-group">
          <label>課程名稱 *</label>
          <input type="text" id="c-name" placeholder="Scratch、Python...">
        </div>
        <div class="form-group">
          <label>課程類型 *</label>
          <select id="c-type" onchange="onCourseTypeChange()">
            <option value="">請選擇</option>
            <option value="regular">常態班</option>
            <option value="camp">營隊</option>
          </select>
        </div>
        <div class="form-group">
          <label>分校 *</label>
          <select id="c-branch">
            <option value="">請選擇</option>
            <option value="延壽校">延壽校</option>
            <option value="安和校">安和校</option>
            <option value="大直校">大直校</option>
            <option value="板橋校">板橋校</option>
            <option value="重慶校">重慶校</option>
          </select>
        </div>
      </div>

      <!-- 常態班欄位 -->
      <div class="form-row course-type-fields" id="regular-fields">
        <div class="form-group">
          <label>上課星期</label>
          <select id="c-weekday">
            <option value="">請選擇</option>
            <option value="1">週一</option>
            <option value="2">週二</option>
            <option value="3">週三</option>
            <option value="4">週四</option>
            <option value="5">週五</option>
            <option value="6">週六</option>
            <option value="0">週日</option>
          </select>
        </div>
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="c-time-start">
        </div>
        <div class="form-group">
          <label>結束時間</label>
          <input type="time" id="c-time-end">
        </div>
      </div>

      <!-- 營隊欄位 -->
      <div class="form-row course-type-fields" id="camp-fields">
        <div class="form-group">
          <label>開始日期</label>
          <input type="date" id="c-date-start">
        </div>
        <div class="form-group">
          <label>結束日期</label>
          <input type="date" id="c-date-end">
        </div>
        <div class="form-group">
          <label>每日開始時間</label>
          <input type="time" id="c-camp-time-start">
        </div>
        <div class="form-group">
          <label>每日結束時間</label>
          <input type="time" id="c-camp-time-end">
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" onclick="createCourse()">新增課程</button>
      </div>
    </div>

    <!-- 課程清單 -->
    <div class="card">
      <div class="card-title">課程清單</div>
      <div class="filter-bar">
        <span class="filter-label">篩選：</span>
        <button class="filter-chip active" onclick="filterCourses('all', this)">全部</button>
        <button class="filter-chip" onclick="filterCourses('regular', this)">常態班</button>
        <button class="filter-chip" onclick="filterCourses('camp', this)">營隊</button>
        <button class="filter-chip" onclick="filterCourses('active', this)">上課中</button>
        <button class="filter-chip" onclick="filterCourses('inactive', this)">已結束</button>
        <button class="filter-chip" onclick="filterCourses('延壽校', this)">延壽校</button>
        <button class="filter-chip" onclick="filterCourses('安和校', this)">安和校</button>
        <button class="filter-chip" onclick="filterCourses('大直校', this)">大直校</button>
        <button class="filter-chip" onclick="filterCourses('板橋校', this)">板橋校</button>
        <button class="filter-chip" onclick="filterCourses('重慶校', this)">重慶校</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>課程名稱</th>
              <th>類型</th>
              <th>分校</th>
              <th>時間</th>
              <th>授課講師</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="course-list">
            <tr><td colspan="7" class="loading">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ========== 可上班時間頁面 ========== -->
  <div class="page" id="page-availability">

    <!-- 選擇講師 -->
    <div class="card">
      <div class="card-title">選擇講師</div>
      <div class="form-row">
        <div class="form-group" style="max-width:240px">
          <label>講師</label>
          <select id="avail-teacher-select" onchange="onAvailTeacherChange()">
            <option value="">— 請選擇講師 —</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 選擇講師後才顯示下方區塊 -->
    <div id="avail-content" style="display:none">

      <!-- 可去的分校 + 常態班可上班時間 並排 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

        <!-- 可去的分校 -->
        <div class="card">
          <div class="card-title">可去的分校</div>
          <p style="font-size:12px;color:var(--gray-600);margin-bottom:12px">勾選這位講師可以前往的分校</p>
          <div id="branch-checkbox-list">
            <!-- 由 JS 渲染 -->
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px">
            <button class="btn btn-primary" onclick="saveTeacherBranches()">儲存分校</button>
          </div>
        </div>

        <!-- 常態班可上班時間 -->
        <div class="card">
          <div class="card-title">常態班可上班時間</div>
          <div class="form-row" style="align-items:flex-end;margin-bottom:8px">
            <div class="form-group">
              <label>星期</label>
              <select id="avail-reg-weekday">
                <option value="">請選擇</option>
                <option value="1">週一</option>
                <option value="2">週二</option>
                <option value="3">週三</option>
                <option value="4">週四</option>
                <option value="5">週五</option>
                <option value="6">週六</option>
                <option value="0">週日</option>
              </select>
            </div>
            <div class="form-group">
              <label>開始時間</label>
              <input type="time" id="avail-reg-start">
            </div>
            <div class="form-group">
              <label>結束時間</label>
              <input type="time" id="avail-reg-end">
            </div>
            <div style="padding-bottom:2px">
              <button class="btn btn-primary" onclick="addRegularAvailability()">新增</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>星期</th><th>時段</th><th>操作</th></tr>
              </thead>
              <tbody id="avail-reg-list">
                <tr><td colspan="3" class="loading">請先選擇講師</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- 營隊可上班時段（從課程清單撈不重複的營隊日期區間） -->
      <div class="card">
        <div class="card-title">營隊可上班時段</div>
        <p style="font-size:12px;color:var(--gray-600);margin-bottom:12px">

// ============================================================
// JSONP API
// ============================================================
const App = { _cbs: {} };
App.call = function(action, payload) {
  return new Promise(function(resolve, reject) {
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const timer = setTimeout(() => { delete window[cbName]; reject(new Error('timeout')); }, 15000);
    window[cbName] = function(data) {
      clearTimeout(timer);
      delete window[cbName];
      resolve(data);
    };
    const script = document.createElement('script');
    script.onerror = () => { clearTimeout(timer); reject(new Error('network error')); };
    script.src = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify({ action, payload })) + '&callback=' + cbName;
    document.body.appendChild(script);
    script.addEventListener('load', () => { setTimeout(() => script.remove(), 1000); });
  });
};

// ============================================================

const WEEKDAY_MAP = { '0':'週日','1':'週一','2':'週二','3':'週三','4':'週四','5':'週五','6':'週六' };

function formatWeekday(val) { return WEEKDAY_MAP[String(val)] || ''; }

function formatCourseTime(c) {
  if (c.type === 'regular') {
    const wd = formatWeekday(c.weekday);
    const ts = c.time_start || '';
    const te = c.time_end || '';
    return [wd, ts && te ? `${ts}–${te}` : ''].filter(Boolean).join(' ');
  } else if (c.type === 'camp') {
    const ds = c.date_start || '';
    const de = c.date_end || '';
    const ts = c.time_start || '';
    const te = c.time_end || '';
    let s = ds && de ? `${ds} ~ ${de}` : '';
    if (ts && te) s += ` ${ts}–${te}`;
    return s;
  }
  return '';
}

async function saveTeacherSkills(teacherId) {
  // 收集所有勾選的技能名稱
  const checkboxes = document.querySelectorAll('#skills-checkbox-list input[type="checkbox"]');
  const checkedSkills = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

  try {
    const res = await App.call('setTeacherSkills', {
      teacher_id: teacherId,
      course_ids: checkedSkills
    });
    if (res.success) {
      showToast('✓ 授課技能已儲存');
      renderTeacherDetailBody(currentEditTeacher);
    } else {
      showToast('儲存失敗：' + res.error);
    }
  } catch(e) {
    showToast('儲存失敗，請稍後再試');
  }
}

    email: document.getElementById('e-email').value.trim(),
    phone: document.getElementById('e-phone').value.trim(),

    id_number: document.getElementById('e-id-number').value.trim(),
    birthday: document.getElementById('e-birthday').value,
    address: document.getElementById('e-address').value.trim(),
    bank_code: document.getElementById('e-bank-code').value,
    bank_account: document.getElementById('e-bank-account').value.trim(),
    note: document.getElementById('e-note').value.trim()
  };
  if (!payload.name) { showToast('請輸入姓名'); return; }
  try {
    const res = await App.call('updateTeacher', payload);
    if (res.success) {
      showToast('✓ 講師資料已更新');
      closeModal('teacher-modal');
      await loadTeachers();
    } else { showToast('更新失敗：' + res.error); }

}

async function createTeacher() {
  const name = document.getElementById('t-name').value.trim();
  if (!name) { showToast('請輸入姓名'); return; }
  const payload = {
    name,
    email: document.getElementById('t-email').value.trim(),
    phone: document.getElementById('t-phone').value.trim(),
    id_number: document.getElementById('t-id-number').value.trim(),
    birthday: document.getElementById('t-birthday').value,
    address: document.getElementById('t-address').value.trim(),
    bank_code: document.getElementById('t-bank-code').value,
    bank_account: document.getElementById('t-bank-account').value.trim(),
    note: document.getElementById('t-note').value.trim()
  };
  try {
    const res = await App.call('createTeacher', payload);
    if (res.success) {
      showToast('✓ 已新增講師：' + name);
      // 清空表單
      ['t-name','t-email','t-phone','t-id-number','t-birthday','t-address','t-bank-search','t-bank-code','t-bank-account','t-note'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      await loadTeachers();
    } else { showToast('新增失敗：' + res.error); }
  } catch(e) { showToast('新增失敗，請稍後再試'); }
}

async function loadCourses() {
  try {
    const res = await App.call('getCourses');
    if (res.success) {
      allCourses = res.data;
      renderCourseList();
    }
  } catch(e) { showToast('載入課程失敗'); }
}

function renderCourseList() {
  const tbody = document.getElementById('course-list');
  let data = allCourses;
  if (courseFilter === 'regular') data = data.filter(c => c.type === 'regular');
  else if (courseFilter === 'camp') data = data.filter(c => c.type === 'camp');
  else if (courseFilter === 'active') data = data.filter(c => c.status === 'active');
  else if (courseFilter === 'inactive') data = data.filter(c => c.status === 'inactive');
  // 分校篩選：不符合上述固定值時視為分校名稱篩選
  else if (courseFilter !== 'all') data = data.filter(c => c.branch === courseFilter);

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">📚</div><p>尚無課程資料</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(c => {
    const timeStr = formatCourseTime(c);
    const typeLabel = c.type === 'regular' ? '常態班' : c.type === 'camp' ? '營隊' : '—';
    const typeBadge = c.type === 'regular' ? 'badge-regular' : 'badge-camp';

    return `
    <tr>
      <td><strong>${c.name}</strong></td>
      <td><span class="badge ${typeBadge}">${typeLabel}</span></td>
      <td>${c.branch || '—'}</td>
      <td style="font-size:12px;color:var(--gray-600)">${timeStr || '—'}</td>
      <td>
        <select class="inline-select" onchange="updateCourseTeacher('${c.id}', this.value)">
          <option value="">— 指定講師 —</option>
          ${allTeachers.filter(t => t.status === 'active').map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
        </select>
      </td>
      <td>
        <select class="inline-select" onchange="updateCourseStatus('${c.id}', this.value)">
          <option value="active" ${c.status === 'active' ? 'selected' : ''}>上課中</option>
          <option value="inactive" ${c.status === 'inactive' ? 'selected' : ''}>已結束</option>
        </select>
      </td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-outline" onclick="openCourseDetail('${c.id}')">詳細</button>
          <button class="btn btn-sm btn-outline" onclick="openCourseEdit('${c.id}')">編輯</button>
        </div>
      </td>
    </tr>
    `;
  }).join('');
}

function filterCourses(val, el) {
  courseFilter = val;
  document.querySelectorAll('#page-courses .filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderCourseList();
}

async function updateCourseStatus(id, status) {
  try {
    const res = await App.call('updateCourse', { id, status });
    if (res.success) {
      const c = allCourses.find(c => c.id === id);
      if (c) c.status = status;
      showToast('✓ 狀態已更新');
    } else { showToast('更新失敗'); }
  } catch(e) { showToast('更新失敗'); }
}

async function updateCourseTeacher(courseId, teacherId) {
  if (!teacherId) return;
  // 新增一筆 Session 記錄
  try {
    const c = allCourses.find(c => c.id === courseId);
    const payload = {
      type: c ? c.type : 'regular',
      course_id: courseId,
      teacher_id: teacherId,
      date: '',
      time_start: c ? (c.time_start || '') : '',
      time_end: c ? (c.time_end || '') : '',
      note: '由課程管理指定'
    };
    const res = await App.call('createSession', payload);
    if (res.success) {
      showToast('✓ 已指定授課講師：' + getTeacherName(teacherId));
    } else { showToast('指定失敗'); }
  } catch(e) { showToast('指定失敗'); }
}

async function saveCourse() {

    name: document.getElementById('ec-name').value.trim(),
    type,
    branch: document.getElementById('ec-branch').value,

      ? document.getElementById('ec-time-end').value

// 固定的分校清單
const BRANCHES = ['延壽校', '安和校', '大直校', '板橋校', '重慶校'];

// 目前選擇的講師 id
let currentAvailTeacherId = null;
// 暫存目前講師已勾選的分校
let currentTeacherBranches = [];

// 填入講師下拉選單（只顯示在職講師）
function populateAvailTeacherSelect() {
  const sel = document.getElementById('avail-teacher-select');
  const current = sel.value;

// 選擇講師後同時載入：分校設定、常態班時間、營隊時段
async function onAvailTeacherChange() {
  const teacherId = document.getElementById('avail-teacher-select').value;
  if (!teacherId) {
    document.getElementById('avail-content').style.display = 'none';
    return;
  }
  currentAvailTeacherId = teacherId;
  document.getElementById('avail-content').style.display = 'block';
  document.getElementById('avail-reg-list').innerHTML = `<tr><td colspan="3" class="loading">載入中...</td></tr>`;
  document.getElementById('branch-checkbox-list').innerHTML = `<div class="loading">載入中...</div>`;
  document.getElementById('camp-avail-checkbox-list').innerHTML = `<div class="loading">載入中...</div>`;

  try {
    // 同時載入分校設定與可上班時間
    const [branchRes, availRes] = await Promise.all([
      App.call('getTeacherBranches', { teacher_id: teacherId }),
      App.call('getAvailability', { teacher_id: teacherId })
    ]);

    // 渲染分校勾選清單
    if (branchRes.success) {
      currentTeacherBranches = branchRes.data.map(b => b.branch);
      renderBranchCheckboxList();
    }

    // 渲染常態班時間清單
    if (availRes.success) {
      renderRegularAvailList(availRes.data.regular);
    }

    // 渲染營隊時段勾選清單（從課程清單撈不重複的日期區間）
    renderCampAvailCheckboxList(availRes.success ? availRes.data.camp : []);

  } catch(e) {
    showToast('載入失敗，請稍後再試');
  }
}

// 渲染分校勾選清單

// 渲染營隊可上班時段勾選清單
// 從課程管理裡的營隊撈出不重複的日期區間，讓講師勾選有空的時段
function renderCampAvailCheckboxList(existingCampList) {
  const container = document.getElementById('camp-avail-checkbox-list');

  // 從所有課程中篩選出營隊，取得不重複的日期區間
  const campCourses = allCourses.filter(c => c.type === 'camp' && c.date_start && c.date_end);

  // 用「開始日期~結束日期」字串去重複
  const uniqueRanges = [];
  const seen = new Set();
  campCourses.forEach(c => {
    const key = `${c.date_start}~${c.date_end}`;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueRanges.push({ date_start: c.date_start, date_end: c.date_end });
    }
  });

  // 依開始日期排序
  uniqueRanges.sort((a, b) => a.date_start.localeCompare(b.date_start));

  if (!uniqueRanges.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏕️</div><p>目前課程管理中沒有營隊，請先新增營隊課程</p></div>`;
    return;
  }

  // 已儲存的可上班區間，用來判斷哪些要打勾
  const existingKeys = new Set(
    existingCampList.map(r => `${r.date_start}~${r.date_end}`)
  );

  container.innerHTML = uniqueRanges.map(range => {
    const key = `${range.date_start}~${range.date_end}`;
    return `
      <label style="display:flex;align-items:center;gap:10px;padding:10px 0;
        border-bottom:1px solid var(--gray-100);cursor:pointer;font-size:14px;">
        <input type="checkbox"
          data-start="${range.date_start}"
          data-end="${range.date_end}"
          ${existingKeys.has(key) ? 'checked' : ''}
          style="width:16px;height:16px;cursor:pointer;accent-color:var(--primary)">
        <span>${range.date_start} ~ ${range.date_end}</span>
      </label>
    `;
  }).join('');
}

// 儲存營隊可上班時段
// 把所有勾選的日期區間存進 CampAvailability
async function saveCampAvailability() {
  if (!currentAvailTeacherId) return;
  const checkboxes = document.querySelectorAll('#camp-avail-checkbox-list input[type="checkbox"]');
  const checked = Array.from(checkboxes).filter(cb => cb.checked);

  // 先取得目前已存的資料，把沒勾選的刪掉、新勾選的新增
  try {
    const availRes = await App.call('getAvailability', { teacher_id: currentAvailTeacherId });
    const existing = availRes.success ? availRes.data.camp : [];

    const existingKeys = new Set(existing.map(r => `${r.date_start}~${r.date_end}`));
    const checkedKeys = new Set(checked.map(cb => `${cb.dataset.start}~${cb.dataset.end}`));

    // 刪除取消勾選的
    for (const row of existing) {
      const key = `${row.date_start}~${row.date_end}`;
      if (!checkedKeys.has(key)) {
        await App.call('deleteAvailability', { type: 'camp', id: row.id });
      }
    }

    // 新增新勾選的
    for (const cb of checked) {
      const key = `${cb.dataset.start}~${cb.dataset.end}`;
      if (!existingKeys.has(key)) {
        await App.call('createAvailability', {
          type: 'camp',
          teacher_id: currentAvailTeacherId,
          date_start: cb.dataset.start,
          date_end: cb.dataset.end,
          note: ''
        });
      }
    }

    showToast('✓ 營隊時段已儲存');
  } catch(e) {
    showToast('儲存失敗，請稍後再試');
  }
}

// 新增常態班可上班時間
async function addRegularAvailability() {
  if (!currentAvailTeacherId) { showToast('請先選擇講師'); return; }
  const weekday = document.getElementById('avail-reg-weekday').value;
  const timeStart = document.getElementById('avail-reg-start').value;
  const timeEnd = document.getElementById('avail-reg-end').value;
  if (!weekday) { showToast('請選擇星期'); return; }
  if (!timeStart || !timeEnd) { showToast('請填寫開始與結束時間'); return; }
  if (timeStart >= timeEnd) { showToast('結束時間必須晚於開始時間'); return; }

  try {
    const res = await App.call('createAvailability', {
      type: 'regular',
      teacher_id: currentAvailTeacherId,
      weekday,
      time_start: timeStart,
      time_end: timeEnd
    });
    if (res.success) {
      showToast('✓ 已新增常態班時間');
      document.getElementById('avail-reg-weekday').value = '';
      document.getElementById('avail-reg-start').value = '';
      document.getElementById('avail-reg-end').value = '';
      await onAvailTeacherChange();
    } else { showToast('新增失敗：' + res.error); }
  } catch(e) { showToast('新增失敗，請稍後再試'); }
}

// 刪除可上班時間（常態班）
async function deleteAvailability(type, id) {
  if (!confirm('確定要刪除這筆時間嗎？')) return;
  try {
    const res = await App.call('deleteAvailability', { type, id });
    if (res.success) {
      showToast('✓ 已刪除');
      await onAvailTeacherChange();
    } else { showToast('刪除失敗：' + res.error); }
  } catch(e) { showToast('刪除失敗，請稍後再試'); }
}

// ============================================================
// 初始化
// ============================================================
(async function init() {
  // 同時載入講師與課程資料
  await Promise.all([loadTeachers(), loadCourses()]);
  // 講師資料載入後填入可上班時間頁面的講師下拉選單
  populateAvailTeacherSelect();
})();
</script>
