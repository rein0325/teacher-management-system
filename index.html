<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講師管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
  --primary: #e6a800;
  --primary-hover: #cc9400;
  --danger: #d93025;
  --success: #188038;
  --warning: #f29900;
  --gray-50: #f8f9fa;
  --gray-100: #f1f3f4;
  --gray-200: #e8eaed;
  --gray-400: #bdc1c6;
  --gray-600: #80868b;
  --gray-800: #3c4043;
  --gray-900: #202124;
  --border: #dadce0;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
  --radius: 8px;
}

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
    font-size: 14px;
  }

  .topbar {
    background: #fffbef;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 8px;
  }
  .topbar-logo {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    margin-right: 24px;
    white-space: nowrap;
  }
  .nav-btn {
    padding: 8px 16px;
    border: none;
    background: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-800);
    transition: background 0.15s;
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--gray-100); }
  .nav-btn.active { background: #fff3c4; color: var(--primary); font-weight: 500; }

  .main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-900);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
  }

  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .form-group.full { flex: 100%; min-width: 100%; }
  .form-group label { font-size: 12px; font-weight: 500; color: var(--gray-600); }
  .form-group input,
  .form-group select,
  .form-group textarea {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-900);
    background: #fff;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { outline: none; border-color: var(--primary); }
  .form-group textarea { resize: vertical; min-height: 72px; }

  .bank-search-wrap { position: relative; }
  .bank-dropdown {
    position: absolute; top: 100%; left: 0; right: 0;
    background: #fff; border: 1px solid var(--border);
    border-radius: 4px; box-shadow: var(--shadow-lg);
    max-height: 200px; overflow-y: auto; z-index: 50; display: none;
  }
  .bank-dropdown.show { display: block; }
  .bank-option { padding: 8px 12px; cursor: pointer; transition: background 0.1s; font-size: 13px; }
  .bank-option:hover { background: var(--gray-100); }
  .bank-option span { color: var(--gray-600); margin-right: 8px; font-size: 12px; }

  .course-type-fields { display: none; }
  .course-type-fields.show { display: flex; }

  .btn {
    padding: 8px 20px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 14px; font-family: inherit;
    font-weight: 500; transition: background 0.15s, box-shadow 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: #e8f0fe; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: #fce8e6; }
  .btn-success { background: #fff; color: var(--success); border: 1px solid var(--success); }
  .btn-success:hover { background: #e6f4ea; }
  .btn-warning { background: #fff; color: var(--warning); border: 1px solid var(--warning); }
  .btn-warning:hover { background: #fef7e0; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-bar .filter-label { font-size: 13px; color: var(--gray-600); }
  .filter-chip {
    padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 13px; font-family: inherit;
    color: var(--gray-800); transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
  .filter-chip.active { background: #fff3c4; border-color: var(--primary); color: var(--primary); font-weight: 500; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 10px 12px; font-size: 12px;
    font-weight: 600; color: var(--gray-600);
    border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--gray-100); font-size: 13px; color: var(--gray-800); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .badge-active { background: #e6f4ea; color: var(--success); }
  .badge-inactive { background: #f1f3f4; color: var(--gray-600); }
  .badge-regular { background: #e8f0fe; color: var(--primary); }
  .badge-camp { background: #fce8e6; color: var(--danger); }
  .badge-planned { background: #fef7e0; color: var(--warning); }
  .badge-completed { background: #f1f3f4; color: var(--gray-600); }

  .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius);
    width: 90%; max-width: 560px; max-height: 85vh;
    overflow-y: auto; padding: 24px; position: relative;
    box-shadow: var(--shadow-lg);
  }
  .modal-wide { max-width: 700px; }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: var(--gray-900); }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; font-size: 20px;
    cursor: pointer; color: var(--gray-600); line-height: 1; padding: 4px;
  }
  .modal-close:hover { color: var(--gray-900); }
  .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }

  .detail-section { margin-bottom: 16px; }
  .detail-section-title {
    font-size: 11px; font-weight: 600; color: var(--gray-600);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--gray-100);
  }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .detail-label { font-size: 12px; color: var(--gray-600); width: 80px; flex-shrink: 0; padding-top: 1px; }
  .detail-value { font-size: 13px; color: var(--gray-900); flex: 1; }

  .inline-select {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 6px; font-size: 12px; font-family: inherit;
    cursor: pointer; background: #fff;
  }
  .inline-select:focus { outline: none; border-color: var(--primary); }

  .empty-state { text-align: center; padding: 40px 16px; color: var(--gray-600); }
  .empty-state-icon { font-size: 36px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  .loading { text-align: center; padding: 32px; color: var(--gray-600); font-size: 13px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gray-900); color: #fff;
    padding: 10px 20px; border-radius: 4px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    z-index: 999; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .section-sep { border: none; border-top: 1px solid var(--gray-100); margin: 16px 0; }

  /* 排班表格樣式 */
  .schedule-table-wrap { overflow-x: auto; margin-top: 0; }
  .schedule-table { width: 100%; border-collapse: collapse; min-width: 700px; }
  .schedule-table th {
    background: var(--gray-100); padding: 10px 12px;
    font-size: 12px; font-weight: 600; color: var(--gray-600);
    border: 1px solid var(--border); text-align: center;
  }
  .schedule-table th.week-col { text-align: left; width: 100px; }
  .schedule-table td {
    border: 1px solid var(--border); vertical-align: top;
    padding: 0; min-height: 100px;
  }
  .schedule-table td.week-label {
    background: var(--gray-50); padding: 10px 12px;
    vertical-align: middle; text-align: left;
  }
  .week-label-main { font-size: 12px; font-weight: 600; color: var(--gray-900); }
  .week-label-sub { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
  .schedule-cell { padding: 8px; min-height: 90px; }
  .schedule-cell-empty { padding: 12px; color: var(--gray-400); font-size: 12px; text-align: center; }

  /* 課程 chip */
  .course-chip { border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .course-chip:last-child { margin-bottom: 0; }
  .chip-name { font-size: 11px; font-weight: 600; }
  .chip-skill { font-size: 10px; margin-top: 1px; opacity: 0.8; }
  .chip-role-row { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
  .chip-role-label { font-size: 10px; color: var(--gray-600); width: 20px; flex-shrink: 0; }
  .chip-person { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
  .chip-add-btn {
    font-size: 10px; color: var(--gray-600); background: none;
    border: 1px dashed var(--gray-400); border-radius: 4px;
    padding: 1px 6px; cursor: pointer;
  }
  .chip-add-btn:hover { border-color: var(--primary); color: var(--primary); }
  .no-skill-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--warning);
    margin-left: 3px; vertical-align: middle;
  }

  /* chip 顏色：依技能分類 */
  .chip-scratch { background: #e8f0fe; }
  .chip-scratch .chip-name { color: #1557b0; }
  .chip-scratch .chip-skill { color: #1a73e8; }
  .chip-scratch .chip-person { background: #c5d8fb; color: #1557b0; }

  .chip-minecraft { background: #e6f4ea; }
  .chip-minecraft .chip-name { color: #137333; }
  .chip-minecraft .chip-skill { color: #188038; }
  .chip-minecraft .chip-person { background: #b7dfc4; color: #137333; }

  .chip-lego { background: #fef7e0; }
  .chip-lego .chip-name { color: #b06000; }
  .chip-lego .chip-skill { color: #f29900; }
  .chip-lego .chip-person { background: #fde68a; color: #b06000; }

  .chip-roblox { background: #f3e8fd; }
  .chip-roblox .chip-name { color: #7b1fa2; }
  .chip-roblox .chip-skill { color: #9c27b0; }
  .chip-roblox .chip-person { background: #ddb8f5; color: #7b1fa2; }

  .chip-python { background: #e0f7fa; }
  .chip-python .chip-name { color: #006064; }
  .chip-python .chip-skill { color: #00838f; }
  .chip-python .chip-person { background: #b2ebf2; color: #006064; }

  .chip-default { background: var(--gray-100); }
  .chip-default .chip-name { color: var(--gray-800); }
  .chip-default .chip-skill { color: var(--gray-600); }
  .chip-default .chip-person { background: var(--gray-200); color: var(--gray-800); }

  /* 推薦彈窗講師列表 */
  .recommend-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--gray-100);
  }
  .recommend-item:last-child { border-bottom: none; }
  .recommend-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #e8f0fe; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600;
    color: var(--primary); flex-shrink: 0;
  }
  .recommend-name { font-size: 13px; font-weight: 500; color: var(--gray-900); }
  .recommend-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .tag-ok { background: #e6f4ea; color: var(--success); font-size: 10px; padding: 1px 6px; border-radius: 8px; }
  .tag-warn { background: #fef7e0; color: var(--warning); font-size: 10px; padding: 1px 6px; border-radius: 8px; }
  .recommend-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

  .schedule-legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    padding: 12px 0; font-size: 11px; color: var(--gray-600);
    align-items: center;
  }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

  @media (max-width: 600px) {
    .topbar { padding: 0 12px; }
    .main { padding: 16px 10px; }
    .form-group { min-width: 100%; }
    .modal { max-width: 98vw; padding: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">📋 講師管理系統</div>
  <button class="nav-btn active" onclick="switchPage('teachers', this)">講師管理</button>
  <button class="nav-btn" onclick="switchPage('courses', this)">課程管理</button>
  <button class="nav-btn" onclick="switchPage('availability', this)">可上班時間</button>
  <button class="nav-btn" onclick="switchPage('schedule', this)">排班管理</button>
</div>

<div class="main">

  <!-- ========== 講師頁面 ========== -->
  <div class="page active" id="page-teachers">
    <div class="card">
      <div class="card-title">新增講師</div>
      <div class="form-row">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="t-name" placeholder="王小明">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="t-email" placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label>手機號碼</label>
          <input type="tel" id="t-phone" placeholder="0912345678">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>身分證字號</label>
          <input type="text" id="t-id-number" placeholder="A123456789">
        </div>
        <div class="form-group">
          <label>生日</label>
          <input type="date" id="t-birthday">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>地址</label>
          <input type="text" id="t-address" placeholder="台北市...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>銀行代碼</label>
          <div class="bank-search-wrap">
            <input type="text" id="t-bank-search" placeholder="輸入銀行名稱或代碼搜尋" autocomplete="off" oninput="filterBanks()" onfocus="showBankDropdown()" onblur="hideBankDropdown()">
            <input type="hidden" id="t-bank-code">
            <div class="bank-dropdown" id="bank-dropdown"></div>
          </div>
        </div>
        <div class="form-group">
          <label>銀行帳號</label>
          <input type="text" id="t-bank-account" placeholder="帳號數字">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>備註</label>
          <textarea id="t-note" placeholder="其他備註..."></textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" onclick="createTeacher()">新增講師</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">講師清單</div>
      <div class="filter-bar">
        <span class="filter-label">篩選：</span>
        <button class="filter-chip active" onclick="filterTeachers('all', this)">全部</button>
        <button class="filter-chip" onclick="filterTeachers('active', this)">在職</button>
        <button class="filter-chip" onclick="filterTeachers('inactive', this)">離職</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>姓名</th><th>Email</th><th>手機</th><th>狀態</th><th>操作</th></tr>
          </thead>
          <tbody id="teacher-list">
            <tr><td colspan="5" class="loading">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ========== 課程頁面 ========== -->
  <div class="page" id="page-courses">
    <div class="card">
      <div class="card-title">新增課程</div>
      <div class="form-row">
        <div class="form-group">
          <label>課程名稱 *</label>
          <input type="text" id="c-name" placeholder="Scratch探險家...">
        </div>
        <div class="form-group">
          <label>課程類型 *</label>
          <select id="c-type" onchange="onCourseTypeChange()">
            <option value="">請選擇</option>
            <option value="regular">常態班</option>
            <option value="camp">營隊</option>
          </select>
        </div>
        <div class="form-group">
          <label>分校 *</label>
          <select id="c-branch">
            <option value="">請選擇</option>
            <option value="延壽校">延壽校</option>
            <option value="安和校">安和校</option>
            <option value="大直校">大直校</option>
            <option value="板橋校">板橋校</option>
            <option value="重慶校">重慶校</option>
          </select>
        </div>
        <div class="form-group">
          <label>詳細分類（梯次）</label>
          <input type="text" id="c-category" placeholder="如：2026冬令營">
        </div>
        <div class="form-group">
          <label>課程主題（技能）</label>
          <select id="c-skill">
            <option value="">請選擇</option>
            <option value="Scratch">Scratch</option>
            <option value="Scratch JR">Scratch JR</option>
            <option value="Arcade">Arcade</option>
            <option value="Scratch+MicroBit">Scratch+MicroBit</option>
            <option value="Scratch AI">Scratch AI</option>
            <option value="Python">Python</option>
            <option value="MicroPython">MicroPython</option>
            <option value="Lego">Lego</option>
            <option value="Minecraft">Minecraft</option>
            <option value="MicroBit">MicroBit</option>
            <option value="Roblox">Roblox</option>
            <option value="MPM數學">MPM數學</option>
            <option value="時時學">時時學</option>
          </select>
        </div>
      </div>

      <!-- 常態班欄位 -->
      <div class="form-row course-type-fields" id="regular-fields">
        <div class="form-group">
          <label>上課星期</label>
          <select id="c-weekday">
            <option value="">請選擇</option>
            <option value="1">週一</option>
            <option value="2">週二</option>
            <option value="3">週三</option>
            <option value="4">週四</option>
            <option value="5">週五</option>
            <option value="6">週六</option>
            <option value="0">週日</option>
          </select>
        </div>
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="c-time-start" onchange="onRegularTimeStartChange()">
        </div>
        <div class="form-group">
          <label>結束時間</label>
          <input type="time" id="c-time-end">
        </div>
      </div>

      <!-- 營隊欄位（移除每日時間） -->
      <div class="form-row course-type-fields" id="camp-fields">
        <div class="form-group">
          <label>開始日期</label>
          <input type="date" id="c-date-start" onchange="onCampDateStartChange()">
        </div>
        <div class="form-group">
          <label>結束日期</label>
          <input type="date" id="c-date-end">
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" onclick="createCourse()">新增課程</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">課程清單</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:12px;color:var(--gray-600);width:36px;flex-shrink:0;">狀態</span>
          <button class="filter-chip active" onclick="setCourseFilter('status','all',this)">全部</button>
          <button class="filter-chip" onclick="setCourseFilter('status','active',this)">上課中</button>
          <button class="filter-chip" onclick="setCourseFilter('status','inactive',this)">已結束</button>
        </div>

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-BbbcHTd1LgkcdcgBvHosN9OtgxuojIArBj2E9GrVaHsgAm6b22rVcXbBdHZpWlZ_mA/exec';

// ============================================================
// JSONP API
// ============================================================
const App = { _cbs: {} };
App.call = function(action, payload) {
  return new Promise(function(resolve, reject) {
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const timer = setTimeout(() => { delete window[cbName]; reject(new Error('timeout')); }, 15000);
    window[cbName] = function(data) {
      clearTimeout(timer);
      delete window[cbName];
      resolve(data);
    };
    const script = document.createElement('script');
    script.onerror = () => { clearTimeout(timer); reject(new Error('network error')); };
    script.src = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify({ action, payload })) + '&callback=' + cbName;
    document.body.appendChild(script);
    script.addEventListener('load', () => { setTimeout(() => script.remove(), 1000); });
  });
};

// ============================================================
// Toast
// ============================================================
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), duration);
}

// ============================================================
// 頁面切換
// ============================================================
function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (btn) btn.classList.add('active');

  if (page === 'schedule') loadScheduleCategories();
}

function filterBanks() {
  const q = document.getElementById('t-bank-search').value.toLowerCase();
  const list = q ? BANKS.filter(b => b.code.includes(q) || b.name.includes(q)) : BANKS;
  renderBankDropdown(list);
}
function renderBankDropdown(list) {
  const dd = document.getElementById('bank-dropdown');
  dd.innerHTML = list.slice(0, 30).map(b =>
    `<div class="bank-option" onmousedown="selectBank('${b.code}','${b.name}')"><span>${b.code}</span>${b.name}</div>`
  ).join('');
  dd.classList.add('show');
}
function showBankDropdown() { renderBankDropdown(BANKS.slice(0, 30)); }
function hideBankDropdown() { setTimeout(() => document.getElementById('bank-dropdown').classList.remove('show'), 200); }
function selectBank(code, name) {
  document.getElementById('t-bank-search').value = `${code} ${name}`;
  document.getElementById('t-bank-code').value = code;
  document.getElementById('bank-dropdown').classList.remove('show');
}

// ============================================================
// 課程類型切換
// ============================================================
function onCourseTypeChange() {
  const type = document.getElementById('c-type').value;
  document.getElementById('regular-fields').classList.toggle('show', type === 'regular');
  document.getElementById('camp-fields').classList.toggle('show', type === 'camp');
}

function onRegularTimeStartChange() {
  const start = document.getElementById('c-time-start').value;
  if (!start) return;
  const [h, m] = start.split(':').map(Number);
  const endH = String((h + 2) % 24).padStart(2, '0');
  const endM = String(m).padStart(2, '0');
  document.getElementById('c-time-end').value = `${endH}:${endM}`;
}

function onCampDateStartChange() {
  const start = document.getElementById('c-date-start').value;
  if (!start) return;
  const d = new Date(start);
  d.setDate(d.getDate() + 4);
  const yyyy = d.getFullYear();
  const mo   = String(d.getMonth() + 1).padStart(2, '0');
  const dd   = String(d.getDate()).padStart(2, '0');
  document.getElementById('c-date-end').value = `${yyyy}-${mo}-${dd}`;
}

// ============================================================
// 工具函式
// ============================================================
function formatWeekday(val) { return WEEKDAY_MAP[String(val)] || ''; }

function formatCourseTime(c) {
  if (c.type === 'regular') {
    const wd = formatWeekday(c.weekday);
    const ts = c.time_start || '';
    const te = c.time_end || '';
    return [wd, ts && te ? `${ts}–${te}` : ''].filter(Boolean).join(' ');
  } else if (c.type === 'camp') {
    const ds = c.date_start || '';
    const de = c.date_end || '';
    return ds && de ? `${ds} ~ ${de}` : '';
  }
  return '';
}

function getTeacherName(id) {
  const t = allTeachers.find(t => t.id === id);
  return t ? t.name : (id ? '(未知)' : '—');
}

function getBankName(code) {
  const b = BANKS.find(b => b.code === String(code));
  return b ? b.name : '';
}

// 根據技能名稱回傳 chip 色系 class
function getChipClass(skill) {
  if (!skill) return 'chip-default';
  const s = skill.toLowerCase();
  if (s.includes('scratch') || s.includes('arcade')) return 'chip-scratch';
  if (s.includes('minecraft') || s.includes('microbit') || s.includes('micropython') || s.includes('lego')) return 'chip-minecraft';
  if (s === 'lego') return 'chip-lego';
  if (s.includes('roblox')) return 'chip-roblox';
  if (s.includes('python')) return 'chip-python';
  return 'chip-default';
}

function renderCourseList() {
  const tbody = document.getElementById('course-list');
  let data = allCourses;

  if (courseFilter.type   !== 'all') data = data.filter(c => c.type   === courseFilter.type);
  if (courseFilter.branch !== 'all') data = data.filter(c => c.branch === courseFilter.branch);

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📚</div><p>尚無課程資料</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(c => {
    const timeStr = formatCourseTime(c);
    const typeLabel = c.type === 'regular' ? '常態班' : c.type === 'camp' ? '營隊' : '—';

    </tr>
  `).join('');

function renderCampAvailCheckboxList(existingCampList) {
  const container = document.getElementById('camp-avail-checkbox-list');
  const campCourses = allCourses.filter(c => c.type === 'camp' && c.date_start && c.date_end);
  const uniqueRanges = [];
  const seen = new Set();
  campCourses.forEach(c => {
    const key = `${c.date_start}~${c.date_end}`;
    if (!seen.has(key)) { seen.add(key); uniqueRanges.push({ date_start: c.date_start, date_end: c.date_end }); }
  });
  uniqueRanges.sort((a, b) => a.date_start.localeCompare(b.date_start));
  if (!uniqueRanges.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏕️</div><p>目前課程管理中沒有營隊，請先新增營隊課程</p></div>`;
    return;
  }
  const existingKeys = new Set(existingCampList.map(r => `${r.date_start}~${r.date_end}`));
  container.innerHTML = uniqueRanges.map(range => {
    const key = `${range.date_start}~${range.date_end}`;
    return `
      <label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);cursor:pointer;font-size:14px;">
        <input type="checkbox" data-start="${range.date_start}" data-end="${range.date_end}" ${existingKeys.has(key) ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer;accent-color:var(--primary)">
        <span>${range.date_start} ~ ${range.date_end}</span>
      </label>
    `;
  }).join('');
}

async function saveCampAvailability() {
  if (!currentAvailTeacherId) return;
  const checkboxes = document.querySelectorAll('#camp-avail-checkbox-list input[type="checkbox"]');
  const checked = Array.from(checkboxes).filter(cb => cb.checked);
  try {
    const availRes = await App.call('getAvailability', { teacher_id: currentAvailTeacherId });
    const existing = availRes.success ? availRes.data.camp : [];
    const existingKeys = new Set(existing.map(r => `${r.date_start}~${r.date_end}`));
    const checkedKeys = new Set(checked.map(cb => `${cb.dataset.start}~${cb.dataset.end}`));
    for (const row of existing) {
      if (!checkedKeys.has(`${row.date_start}~${row.date_end}`)) {
        await App.call('deleteAvailability', { type: 'camp', id: row.id });
      }
    }
    for (const cb of checked) {
      if (!existingKeys.has(`${cb.dataset.start}~${cb.dataset.end}`)) {
        await App.call('createAvailability', { type: 'camp', teacher_id: currentAvailTeacherId, date_start: cb.dataset.start, date_end: cb.dataset.end, note: '' });
      }
    }
    showToast('✓ 營隊時段已儲存');
  } catch(e) { showToast('儲存失敗，請稍後再試'); }
}

async function addRegularAvailability() {
  if (!currentAvailTeacherId) { showToast('請先選擇講師'); return; }
  const weekday = document.getElementById('avail-reg-weekday').value;
  const timeStart = document.getElementById('avail-reg-start').value;
  const timeEnd = document.getElementById('avail-reg-end').value;
  if (!weekday) { showToast('請選擇星期'); return; }
  if (!timeStart || !timeEnd) { showToast('請填寫開始與結束時間'); return; }
  if (timeStart >= timeEnd) { showToast('結束時間必須晚於開始時間'); return; }
  try {
    const res = await App.call('createAvailability', { type: 'regular', teacher_id: currentAvailTeacherId, weekday, time_start: timeStart, time_end: timeEnd });
    if (res.success) {
      showToast('✓ 已新增常態班時間');
      document.getElementById('avail-reg-weekday').value = '';
      document.getElementById('avail-reg-start').value = '';
      document.getElementById('avail-reg-end').value = '';
      await onAvailTeacherChange();
    } else { showToast('新增失敗：' + res.error); }
  } catch(e) { showToast('新增失敗，請稍後再試'); }
}

async function deleteAvailability(type, id) {
  if (!confirm('確定要刪除這筆時間嗎？')) return;
  try {
    const res = await App.call('deleteAvailability', { type, id });
    if (res.success) { showToast('✓ 已刪除'); await onAvailTeacherChange(); }
    else { showToast('刪除失敗：' + res.error); }
  } catch(e) { showToast('刪除失敗，請稍後再試'); }
}

// ============================================================
// ===== 排班管理 =====
// ============================================================

// 載入梯次清單
async function loadScheduleCategories() {
  try {
    const res = await App.call('getCampCategories');
    const sel = document.getElementById('schedule-category-select');
    const current = sel.value;
    if (res.success && res.data.length) {
      sel.innerHTML = '<option value="">— 請選擇梯次 —</option>' +
        res.data.map(cat => `<option value="${cat}" ${cat === current ? 'selected' : ''}>${cat}</option>`).join('');
    } else {
      sel.innerHTML = '<option value="">— 尚無梯次，請先在課程管理新增營隊 —</option>';
    }
  } catch(e) { showToast('載入梯次失敗'); }
}

// 選擇梯次後載入排班資料並渲染表格
async function onScheduleCategoryChange() {
  const category = document.getElementById('schedule-category-select').value;
  if (!category) {
    document.getElementById('schedule-table-wrap').innerHTML = '';
    document.getElementById('schedule-summary').textContent = '';
    document.getElementById('schedule-auto-all-btn').style.display = 'none';
    document.getElementById('schedule-legend-card').style.display = 'none';
    return;
  }
  currentScheduleCategory = category;
  document.getElementById('schedule-table-wrap').innerHTML = `<div class="card"><div class="loading">載入排班資料中...</div></div>`;
  document.getElementById('schedule-auto-all-btn').style.display = 'none';

  try {
    const res = await App.call('getScheduleData');
    if (!res.success) { showToast('載入失敗：' + res.error); return; }
    scheduleData = res.data;
    renderScheduleTable(category);
  } catch(e) { showToast('載入排班資料失敗'); }
}

// 渲染排班表格
function renderScheduleTable(category) {
  if (!scheduleData) return;

  // 篩出這個梯次的營隊課程
  const courses = scheduleData.courses.filter(c => c.type === 'camp' && c.category === category);
  if (!courses.length) {
    document.getElementById('schedule-table-wrap').innerHTML = `<div class="card"><div class="empty-state"><div class="empty-state-icon">📅</div><p>這個梯次沒有課程，請先到課程管理新增</p></div></div>`;
    document.getElementById('schedule-summary').textContent = '';
    return;
  }

  // 取出所有不重複的分校和週次
  const branchSet = new Set();
  const weekSet = new Set();
  courses.forEach(c => {
    if (c.branch) branchSet.add(c.branch);
    if (c.date_start && c.date_end) weekSet.add(`${c.date_start}~${c.date_end}`);
  });
  const branches = BRANCHES.filter(b => branchSet.has(b)); // 按固定順序排
  const weeks = Array.from(weekSet).sort();

  // 摘要
  document.getElementById('schedule-summary').textContent = `共 ${courses.length} 堂課，${branches.length} 個校區，${weeks.length} 週`;
  document.getElementById('schedule-auto-all-btn').style.display = 'block';
  document.getElementById('schedule-legend-card').style.display = 'block';

  // 建立 sessions 的快速查詢 map：course_id -> sessions[]
  const sessionMap = {};
  scheduleData.sessions.forEach(s => {
    if (!sessionMap[s.course_id]) sessionMap[s.course_id] = [];
    sessionMap[s.course_id].push(s);
  });

  // 渲染表格
  const thead = `
    <thead>
      <tr>
        <th class="week-col">週次</th>
        ${branches.map(b => `<th>${b}</th>`).join('')}
      </tr>
    </thead>
  `;

  const tbody = weeks.map((weekKey, wi) => {
    const [dateStart, dateEnd] = weekKey.split('~');
    const cells = branches.map(branch => {
      const cellCourses = courses.filter(c => c.branch === branch && `${c.date_start}~${c.date_end}` === weekKey);
      if (!cellCourses.length) return `<td><div class="schedule-cell-empty">—</div></td>`;
      const chips = cellCourses.map(c => renderCourseChip(c, sessionMap[c.id] || [])).join('');
      return `<td><div class="schedule-cell">${chips}</div></td>`;
    }).join('');

    return `
      <tr>
        <td class="week-label">
          <div class="week-label-main">第 ${wi + 1} 週</div>
          <div class="week-label-sub">${dateStart}</div>
          <div class="week-label-sub">~ ${dateEnd}</div>
        </td>
        ${cells}
      </tr>
    `;
  }).join('');

  document.getElementById('schedule-table-wrap').innerHTML = `
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="schedule-table-wrap">
        <table class="schedule-table">
          ${thead}
          <tbody>${tbody}</tbody>
        </table>
      </div>
    </div>
  `;
}

// 渲染單一課程 chip（包含講師/助教列）
function renderCourseChip(course, sessions) {
  const chipClass = getChipClass(course.skill);

  // 找出這堂課的講師和助教 sessions
  const teacherSession = sessions.find(s => s.role === 'teacher' || (!s.role && s.teacher_id));
  const assistantSession = sessions.find(s => s.role === 'assistant');

  const teacherName = teacherSession ? getTeacherName(teacherSession.teacher_id) : null;
  const assistantName = assistantSession ? getTeacherName(assistantSession.teacher_id) : null;

  // 助教是否有相關技能
  const assistantHasSkill = assistantSession ? checkTeacherSkill(assistantSession.teacher_id, course.skill) : true;

  const teacherRow = teacherName
    ? `<div class="chip-role-row"><span class="chip-role-label">師</span><span class="chip-person">${teacherName}</span></div>`
    : `<div class="chip-role-row"><span class="chip-role-label">師</span><button class="chip-add-btn" onclick="openRecommend('${course.id}', 'teacher')">+ 排班</button></div>`;

  const assistantRow = assistantName
    ? `<div class="chip-role-row"><span class="chip-role-label">助</span><span class="chip-person">${assistantName}</span>${!assistantHasSkill ? '<span class="no-skill-dot" title="助教無相關技能"></span>' : ''}</div>`
    : `<div class="chip-role-row"><span class="chip-role-label">助</span><button class="chip-add-btn" onclick="openRecommend('${course.id}', 'assistant')">+ 排班</button></div>`;

  return `
    <div class="course-chip ${chipClass}">
      <div class="chip-name">${course.name}</div>
      <div class="chip-skill">${course.skill || ''}</div>
      ${teacherRow}
      ${assistantRow}
    </div>
  `;
}

// 檢查講師是否有某技能
function checkTeacherSkill(teacherId, skill) {
  if (!skill || !scheduleData) return true;
  const skills = scheduleData.teacherSkills.filter(s => s.teacher_id === teacherId).map(s => s.course_id);
  return skills.includes(skill);
}

// 開啟推薦彈窗
function openRecommend(courseId, role) {
  if (!scheduleData) return;
  const course = scheduleData.courses.find(c => c.id === courseId);
  if (!course) return;

  currentRecommendInfo = { courseId, role };

  const roleLabel = role === 'teacher' ? '推薦講師' : '推薦助教';
  document.getElementById('recommend-modal-title').textContent = `${course.name}（${course.branch}）— ${roleLabel}`;

  // 計算推薦名單
  const candidates = getRecommendedTeachers(course, role);
  renderRecommendList(candidates, course, role);
  openModal('recommend-modal');
}

// 計算推薦名單
function getRecommendedTeachers(course, role) {
  if (!scheduleData) return [];

  const allT = scheduleData.teachers.filter(t => t.status === 'active');
  const results = [];

  // 找出這個週次已被排班的講師（同週不能去兩個分校）
  const weekKey = `${course.date_start}~${course.date_end}`;
  const busyTeacherIds = new Set();
  scheduleData.sessions.forEach(s => {
    const c = scheduleData.courses.find(c => c.id === s.course_id);
    if (c && `${c.date_start}~${c.date_end}` === weekKey && c.id !== course.id) {
      busyTeacherIds.add(s.teacher_id);
    }
  });

  allT.forEach(t => {
    // 衝突檢查：這週已被排到其他分校
    if (busyTeacherIds.has(t.id)) return;

    // 分校符合檢查
    const teacherBranches = scheduleData.teacherBranches
      .filter(b => b.teacher_id === t.id)
      .map(b => b.branch);
    const branchOk = teacherBranches.includes(course.branch);

    // 時間符合檢查
    const campAvail = scheduleData.campAvailability.filter(a => a.teacher_id === t.id);
    const timeOk = campAvail.some(a => a.date_start === course.date_start && a.date_end === course.date_end);

    // 技能符合檢查
    const teacherSkills = scheduleData.teacherSkills
      .filter(s => s.teacher_id === t.id)
      .map(s => s.course_id);
    const skillOk = course.skill ? teacherSkills.includes(course.skill) : false;

    if (role === 'teacher') {
      // 講師：三個條件都要符合
      if (branchOk && timeOk && skillOk) {
        results.push({ teacher: t, branchOk, timeOk, skillOk });
      }
    } else {
      // 助教：分校 + 時間必須符合，技能不是必要
      if (branchOk && timeOk) {
        results.push({ teacher: t, branchOk, timeOk, skillOk });
      }
    }
  });

  // 排序：技能符合的優先
  results.sort((a, b) => (b.skillOk ? 1 : 0) - (a.skillOk ? 1 : 0));
  return results;
}

// 渲染推薦名單
function renderRecommendList(candidates, course, role) {
  const body = document.getElementById('recommend-modal-body');

  if (!candidates.length) {
    const msg = role === 'teacher'
      ? '沒有同時符合技能、分校、時間三個條件的講師。<br>請確認講師有設定技能、可去分校和營隊可上班時段。'
      : '沒有符合分校和時間條件的助教。<br>請確認講師有設定可去分校和營隊可上班時段。';
    body.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔍</div><p style="text-align:center">${msg}</p></div>`;
    return;
  }

  const roleLabel = role === 'teacher' ? '指派為講師' : '指派為助教';

  body.innerHTML = `
    <p style="font-size:12px;color:var(--gray-600);margin-bottom:12px">
      ${role === 'teacher' ? '以下講師符合技能、分校、時間三個條件：' : '以下人員符合分校和時間條件（技能不符合會標示）：'}
    </p>
    ${candidates.map(({ teacher: t, branchOk, timeOk, skillOk }) => `
      <div class="recommend-item">
        <div class="recommend-avatar">${t.name.charAt(0)}</div>
        <div style="flex:1;min-width:0">
          <div class="recommend-name">${t.name}</div>
          <div class="recommend-tags">
            ${skillOk ? '<span class="tag-ok">技能符合</span>' : '<span class="tag-warn">無相關技能</span>'}
            ${branchOk ? '<span class="tag-ok">分校符合</span>' : ''}
            ${timeOk ? '<span class="tag-ok">時間有空</span>' : ''}
          </div>
        </div>
        <div class="recommend-actions">
          <button class="btn btn-sm btn-success" onclick="assignTeacher('${course.id}', '${t.id}', '${role}')">${roleLabel}</button>
        </div>
      </div>
    `).join('')}
  `;
}

// 指派講師/助教，寫入 Sessions
async function assignTeacher(courseId, teacherId, role) {
  const course = scheduleData.courses.find(c => c.id === courseId);
  if (!course) return;

  try {
    const payload = {
      type: 'camp',
      course_id: courseId,
      teacher_id: teacherId,
      role: role,
      date: course.date_start || '',
      time_start: '',
      time_end: '',
      status: 'planned',
      note: role === 'assistant' ? '助教' : '講師'
    };
    const res = await App.call('createSession', payload);
    if (res.success) {
      showToast(`✓ 已指派 ${getTeacherName(teacherId)} 為${role === 'teacher' ? '講師' : '助教'}`);
      closeModal('recommend-modal');
      // 重新載入排班資料更新表格
      const dataRes = await App.call('getScheduleData');
      if (dataRes.success) {
        scheduleData = dataRes.data;
        renderScheduleTable(currentScheduleCategory);
      }
    } else { showToast('指派失敗：' + res.error); }
  } catch(e) { showToast('指派失敗，請稍後再試'); }
}

// 全部自動排班（幫所有還沒有講師的格子自動選第一位推薦人選）
async function autoScheduleAll() {
  if (!scheduleData || !currentScheduleCategory) return;
  if (!confirm('確定要自動排班所有空缺嗎？系統會為每堂課選擇第一位推薦人選。')) return;

  const courses = scheduleData.courses.filter(c => c.type === 'camp' && c.category === currentScheduleCategory);
  let assigned = 0;

  for (const course of courses) {
    const sessions = scheduleData.sessions.filter(s => s.course_id === course.id);
    const hasTeacher = sessions.some(s => s.role === 'teacher' || (!s.role && s.teacher_id));
    const hasAssistant = sessions.some(s => s.role === 'assistant');

    if (!hasTeacher) {
      const candidates = getRecommendedTeachers(course, 'teacher');
      if (candidates.length) {
        await App.call('createSession', {
          type: 'camp', course_id: course.id,
          teacher_id: candidates[0].teacher.id,
          role: 'teacher', date: course.date_start || '',
          time_start: '', time_end: '', status: 'planned', note: '講師'
        });
        assigned++;
      }
    }
    if (!hasAssistant) {
      const candidates = getRecommendedTeachers(course, 'assistant');
      if (candidates.length) {
        await App.call('createSession', {
          type: 'camp', course_id: course.id,
          teacher_id: candidates[0].teacher.id,
          role: 'assistant', date: course.date_start || '',
          time_start: '', time_end: '', status: 'planned', note: '助教'
        });
        assigned++;
      }
    }
  }

  showToast(`✓ 自動排班完成，共指派 ${assigned} 個職位`);
  const dataRes = await App.call('getScheduleData');
  if (dataRes.success) { scheduleData = dataRes.data; renderScheduleTable(currentScheduleCategory); }
}

// ============================================================
// 初始化
// ============================================================
(async function init() {
  await Promise.all([loadTeachers(), loadCourses()]);
  populateAvailTeacherSelect();
})();
</script>
